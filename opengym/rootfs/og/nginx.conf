# Main nginx config for the openGym app. The server block is upstream's own template
# (web/nginx.conf.template), rendered by run.sh into /tmp/og/default.conf.
user nginx;
worker_processes 1;
pid /tmp/og/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    access_log off;
    # Real client address (22 Nov 2026, the app is public behind the NGINX SSL proxy app): trust
    # X-Forwarded-For only from the Supervisor network, where that proxy lives. The outer vhost
    # (ha-config nginx_proxy/opengym.conf) overwrites the header with the client's address, so a
    # visitor cannot forge it. Without this, openGym's per-address sign-in limits saw ONE address
    # for the whole internet and one stranger could pause sign-in for everybody.
    set_real_ip_from 172.30.32.0/23;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_body_temp_path /tmp/og/client;
    proxy_temp_path /tmp/og/proxy;
    fastcgi_temp_path /tmp/og/fastcgi;
    uwsgi_temp_path /tmp/og/uwsgi;
    scgi_temp_path /tmp/og/scgi;
    include /tmp/og/default.conf;
}
